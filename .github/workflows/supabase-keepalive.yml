# Supabase free-tier projects are paused after ~7 days without API activity.
# This workflow pings the REST API every 3 days so the project stays awake.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions).
# They are the same ones the deploy workflow already uses:
#   SUPABASE_URL       e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  the project's anon/public API key
name: Supabase keepalive

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sSf \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/courses?select=id&limit=1"
